<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JaysGym">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" id="touchIcon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>JaysGym</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f8;--card:#fff;--card2:#f2f2f5;--line:#ebebef;--tx:#17171c;--mut:#85868f;--acc:#e5383b;--accDk:#c62b2e;--soft:#fdeced;--accTx:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:16px;line-height:1.35}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 11px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0;letter-spacing:-.02em;font-weight:800}
h1 span{color:var(--acc)}
#sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:#c8c9cf}
#sync.ok::before{background:#34c759}#sync.err::before{background:var(--acc)}#sync.saving::before{background:#ff9f0a}
main{padding:14px 14px calc(116px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;max-width:180px;color:var(--mut);font-weight:600;font-size:12px;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,20,30,.04)}
.muted{color:var(--mut)}.small{font-size:13px}
.label{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin:10px 4px 10px}
.hero{background:var(--acc);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(229,56,59,.22)}
.hero .wk{font-size:13px;font-weight:700;opacity:.85;letter-spacing:.05em;text-transform:uppercase}
.hero h2{margin:4px 0 2px;font-size:24px;letter-spacing:-.02em}
.hero p{margin:0;opacity:.92;font-size:14px}
.dots{display:flex;gap:6px;margin-top:12px}
.dots i{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.daycard{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.daycard b{font-size:18px;display:block;margin-bottom:3px}
.daycard .go{background:var(--card2);color:var(--tx);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.daycard.next{border-color:var(--acc)}
.daycard.next .go{background:var(--acc);color:#fff}
.badge{display:inline-block;font-size:10.5px;font-weight:800;color:var(--acc);background:var(--soft);border-radius:6px;padding:3px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.exlist{font-size:13px;color:var(--mut);margin-top:3px}
.wohead{margin:2px 4px 10px}
.wohead .top{display:flex;justify-content:space-between;align-items:flex-end}
.wohead h2{margin:0;font-size:26px;letter-spacing:-.02em}
.wohead .t{font-variant-numeric:tabular-nums;color:var(--mut);font-size:15px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--soft);color:var(--accDk);font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:8px}
.chip.g{background:var(--card2);color:#55565e}
.prog{height:5px;background:#ececf0;border-radius:5px;margin:0 4px 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .2s}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.exhead b{font-size:17px}
.tgt{color:var(--acc);font-size:14px;font-weight:700;white-space:nowrap}
.last{color:var(--mut);font-size:13px;margin:3px 0 10px}
.last em{font-style:normal;color:#45464d;font-weight:600}
.ssgroup{border:2px solid var(--acc);background:#fff6f6;border-radius:22px;padding:10px 8px 2px;margin-bottom:14px}
.ssgroup .card{margin-bottom:8px;box-shadow:none}
.sshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 8px 10px}
.sshead span{color:var(--acc);font-weight:800;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.sshead small{color:var(--accDk);font-size:12.5px;font-weight:600}
.lbl{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 6px;border-radius:7px;background:var(--card2);color:#55565e;font-size:12.5px;font-weight:800;margin-right:8px;vertical-align:1px}
.ssgroup .lbl{background:var(--acc);color:#fff}
.pex.inss{border-left:3px solid var(--acc);padding-left:10px;margin-left:-4px}
.sh{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:8px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:0 2px 4px;text-align:center}
.row{display:grid;grid-template-columns:24px 1fr 1fr 46px;gap:8px;align-items:center;padding:5px 2px;border-radius:13px;transition:background .15s}
.row .n{text-align:center;color:var(--mut);font-weight:700;font-size:14px}
.row.done{background:var(--soft)}
.row.done .n{color:var(--acc)}
.step{display:flex;align-items:center;background:var(--card2);border-radius:12px;height:44px;overflow:hidden}
.row.done .step{background:#fff}
.step button{width:34px;height:44px;font-size:21px;color:#9a9ba3;flex:none}
.step button:active{color:var(--acc)}
.step input{flex:1;min-width:0;width:100%;height:44px;background:none;border:0;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;outline:none}
.nostep{display:grid;place-items:center;height:44px;color:#c4c5cb;font-weight:700}
.chk{width:46px;height:44px;border-radius:12px;background:var(--card2);color:#b5b6bd;display:grid;place-items:center}
.chk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.row.done .chk{background:var(--acc);color:#fff}
.exfoot{display:flex;gap:8px;margin-top:8px}
.pill{background:var(--card2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:#45464d}
.pill.dim{color:var(--mut)}
.primary{width:100%;background:var(--acc);color:#fff;font-weight:700;font-size:17px;border-radius:15px;padding:15px;margin-top:6px;box-shadow:0 6px 16px rgba(229,56,59,.25)}
.primary:active{background:var(--accDk)}
.ghost{width:100%;color:var(--mut);font-weight:600;padding:14px;margin-top:4px}
.armed{color:var(--acc)!important}
.addex{width:100%;border:1.5px dashed #d9d9df;border-radius:15px;padding:13px;color:var(--mut);font-weight:600;margin-bottom:12px;background:rgba(255,255,255,.5)}
.inl{display:flex;gap:8px}
.field{background:var(--card2);border:1.5px solid transparent;border-radius:11px;height:42px;padding:0 12px;outline:none;min-width:0}
.field:focus{border-color:var(--acc);background:#fff}
.inl .field{flex:1}
#rest{position:fixed;left:14px;right:14px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:7;box-shadow:0 10px 30px rgba(20,20,30,.13)}
#rest[hidden]{display:none}
#rest b{font-variant-numeric:tabular-nums;font-size:19px;margin:0 4px}
#rest.up{background:var(--acc);border-color:var(--acc);color:#fff}
#rest.up .muted,#rest.up button{color:#fff}
#rest button{color:var(--mut);font-size:14px;font-weight:600;padding:6px 8px}
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--tx);color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;z-index:9;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.hist{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hist b{display:block;font-size:16px}
.hist .chev{color:var(--mut);transition:transform .15s;font-size:20px}
.open .hist .chev{transform:rotate(90deg)}
.hdet{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.hex{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.hex span:last-child{color:#45464d;text-align:right;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em;color:var(--acc)}
.stat span{font-size:12px;color:var(--mut)}
.pday{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.pday .field{flex:1;font-weight:700;font-size:17px}
.pex{border-top:1px solid var(--line);padding:10px 0}
.pex .inl{margin-bottom:8px}
.pnums{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.pnums label{display:flex;align-items:center;gap:5px}
.pnums .field{width:58px;height:36px;padding:0 6px;text-align:center;color:var(--tx);font-size:16px}
.pnums .field.w{width:70px}
.pnums .grow{flex:1}
.ib{width:36px;height:36px;border-radius:10px;background:var(--card2);color:var(--mut);display:grid;place-items:center;font-size:15px;flex:none}
.ib.x{color:var(--acc)}
.ssbtn{font-size:12.5px;font-weight:700;color:var(--mut);background:var(--card2);border-radius:9px;padding:8px 10px;margin-top:8px}
.ssbtn.on{background:var(--soft);color:var(--acc)}
.seg{display:inline-flex;background:var(--card2);border-radius:11px;padding:3px}
.seg button{padding:7px 16px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.setrow+.setrow{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.wkstep{display:flex;align-items:center;gap:6px}
.wkstep b{min-width:72px;text-align:center}
.phase{border-top:1px solid var(--line);padding:10px 0}
.phase:first-of-type{border-top:0}
.note{font-size:13px;color:var(--mut);padding:0 6px;line-height:1.45}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.loading{text-align:center;padding:60px 20px;color:var(--mut)}
.phseg{display:flex;width:100%;margin:0 0 12px}.phseg button{flex:1;padding:8px 4px;font-size:13px}
.daycard.done{background:var(--card2);border-color:transparent;padding:12px 16px}
.daycard.done b{font-size:16px;color:#55565e}
.okmark{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.okmark svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.daycard.later{padding:13px 16px}
.daycard.later b{font-size:16px}
.swap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 2px 10px}
.swap .pill{padding:7px 12px;font-size:13px}
.lastrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0 10px}
.lastrow .last{margin:0}
.formbtn{flex:none;font-size:12.5px;font-weight:700;color:var(--acc);background:var(--soft);border-radius:8px;padding:6px 10px}
.formbtn.on{background:var(--acc);color:#fff}
.demo{background:#fafafb;border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin:-2px 0 12px}
.demo svg{width:100%;max-width:240px;display:block;margin:0 auto 6px}
.demo ul{margin:0;padding-left:18px;font-size:14px;line-height:1.45;color:#3b3c43}
.demo li{margin:3px 0}
.tbox{display:flex;align-items:center;gap:8px}
.pbtn{background:var(--card2);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:#45464d}
.wohead .t.paused{color:var(--acc)}
.pausebar{background:var(--tx);color:#fff;border-radius:16px;padding:13px 14px 13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.pausebar b{font-variant-numeric:tabular-nums}
.pausebar button{background:var(--acc);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;flex:none}
.readybox{margin:0 0 14px}
.readybox .primary{margin-top:0}
.row.wu .n{color:#c58b00;font-size:12.5px}
.row.wu.done{background:#fbf3df}
.row.wu.done .chk{background:#e0a100}
.holdbtn{width:100%;height:44px;border-radius:12px;background:var(--soft);color:var(--acc);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.holdbtn.on{background:var(--acc);color:#fff}
.wutag{font-size:11px;font-weight:800;color:#a87500;background:#fbf3df;border-radius:6px;padding:3px 7px;letter-spacing:.04em;margin:0 0 6px;display:inline-block}
.demo a{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--acc);text-decoration:none}
.hbtns{display:flex;align-items:center;gap:8px;margin-top:10px}
.hbtns .ghost{width:auto;flex:1;margin:0;padding:10px}
.hdet.edit .field{height:40px}
.eex{border-top:1px solid var(--line);padding:12px 0 6px}
.eex:first-of-type{border-top:0}
.ehdr,.erow{display:grid;grid-template-columns:26px 1fr 1fr 36px;gap:8px;align-items:center}
.ehdr{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700;text-align:center;margin:8px 0 4px}
.erow{margin-bottom:6px}
.erow .n{text-align:center;color:var(--mut);font-weight:700;font-size:14px}
.erow.wu .n{color:#c58b00}
.erow .field{width:100%;text-align:center;font-weight:700;padding:0 6px}
input[type=date].field{font-family:inherit;color:var(--tx);min-width:150px}
.bkrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.bkrow .pill{cursor:pointer}
.bkta{width:100%;height:110px;padding:10px 12px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical;margin-bottom:8px}
.logo{width:146px;height:60px;display:block;overflow:visible}
header{padding-top:10px;padding-bottom:8px}
.sug{display:flex;gap:10px;align-items:center;background:#fff4f4;border:1.5px solid #f6c9cb;border-radius:13px;padding:10px 10px 10px 12px;margin:0 0 10px}
.sug.hold{background:#f6f6f8;border-color:var(--line)}
.sgic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;font-weight:800;font-size:14px}
.hold .sgic{background:#85868f}
.sgtx{flex:1;min-width:0}.sug b,.sgrow b{display:block;font-size:14.5px}
.sug span,.sgrow span{display:block;font-size:13px;color:#55565e;line-height:1.35;margin-top:1px}
.sgbtn{flex:none;background:var(--acc);color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:9px 13px}
.sgrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.sgrow+.sgrow{border-top:1px solid var(--line)}
.upchip{display:inline-block;margin-top:7px;background:var(--soft);color:var(--accDk);font-weight:700;font-size:12.5px;border-radius:8px;padding:4px 8px}
.stat b small{font-size:13px;color:var(--mut);font-weight:600}
.chcard{padding:12px 10px 10px}
.chcap{font-size:13px;color:#45464d;min-height:18px;margin:0 4px 6px}
.chart{width:100%;display:block;touch-action:pan-y;cursor:crosshair}
.chart .mk.sel{fill:#c62b2e}
.chart circle.mk.sel{r:6}
.chnote{padding:0 4px;margin:6px 0 0;font-size:12px}
.liftrow{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
.liftrow b{display:block;font-size:16px}
.spark{width:76px;height:24px;flex:none}
.gain{color:#1f8a4c;font-weight:700}.loss{color:var(--acc);font-weight:700}
.liftdet{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.kv{display:flex;justify-content:space-between;padding:7px 2px;font-size:14px;border-top:1px solid var(--line)}
.kv span{color:var(--mut)}
.daycard{cursor:default}
.gobox{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.gobox .go{text-align:center}
.xgo{background:#1d2a4d;color:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:12.5px;white-space:nowrap}
.hin{display:flex;align-items:center;gap:6px}.hin .field{width:58px;height:38px;text-align:center;padding:0 6px}.hin span{color:var(--mut);font-size:13px}
.bwlist{margin-top:8px}.bwx{color:var(--mut);font-size:13px;margin-left:8px;padding:2px 4px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.bdg{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px 12px;text-align:center;overflow:hidden}
.bdg .bic{font-size:24px;line-height:1;width:44px;height:44px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--card2);filter:grayscale(1);opacity:.55}
.bdg.on .bic{background:var(--soft);filter:none;opacity:1;box-shadow:0 0 0 2px var(--acc)}
.bdg b{display:block;font-size:12.5px;line-height:1.2}
.bdg span{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.bdg em{display:none}
.bdg i{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);opacity:.6}
.bdg:not(.on) b{color:#6b6c74}
.celebrate{position:fixed;inset:0;z-index:20;background:rgba(23,23,28,.45);display:grid;place-items:center;padding:24px}
.cbox{position:relative;z-index:2;background:#fff;border-radius:22px;padding:22px 20px 16px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .35s ease-out}
.cbox h3{margin:6px 0 10px;font-size:22px}.cbox p{margin:6px 0;font-size:14.5px;color:#3b3c43}.cbig{font-size:46px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{top:105%;transform:translateX(30px) rotate(540deg)}}
.roundban{text-align:center;margin:-4px 0 6px}
.roundban svg{width:100%;max-width:330px;height:auto;display:block;margin:0 auto;overflow:visible}
.roundban span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:-2px}
.rseg{margin-bottom:8px}
.prog-card .roundban{margin:0 0 8px}
.linkbtn{color:var(--acc);font-weight:700;font-size:13px;text-decoration:underline;padding:0}
.wtgt{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.wtgt span{opacity:.9;margin-right:2px}
.wtgt button{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}

<script>
(function(){

/* ex(name, step, opts): sets/reps blank = follow the phase */
const ex=(name,inc,o)=>Object.assign({id:uid(),name,sets:"",reps:"",inc,ss:false},o||{});

const SS={ss:true};
const DEFAULT={v:4,daysPerWeek:2,startDate:null,
 workouts:[{id:"w1",name:"Workout 1"},{id:"w2",name:"Workout 2"}],
 phases:[
  {name:"Pump",weeks:3,sets:3,reps:"12-15",rest:60,note:"Moderate weight. Own the form and chase the squeeze.",workouts:[
   {id:"w1",exercises:[ex("Back Squat",5),ex("Chest-Supported DB Row",5,SS),ex("Incline DB Press",5),ex("Chin-up (band-assisted if needed)",5,{reps:"8-12",ss:true}),ex("Plank",5,{sets:3,reps:"30-45s"}),ex("Dip",5,{sets:2,reps:"10-15",ss:true}),ex("DB Curl",5,{sets:2})]},
   {id:"w2",exercises:[ex("Barbell Hip Thrust",10),ex("Landmine Press",5,SS),ex("DB Shrug",5),ex("DB Reverse Lunge (reps per leg)",5,SS),ex("Decline Sit-up",5,{sets:3}),ex("DB Skull Crusher",5,{sets:2,ss:true}),ex("Incline DB Curl",5,{sets:2})]}]},
  {name:"Build",weeks:3,sets:3,reps:"8-10",rest:75,note:"Add weight when you hit the top of the rep range. Leave 1–2 reps in the tank.",workouts:[

   {id:"w2",exercises:[ex("Romanian Deadlift",10,{sets:4}),ex("Overhead DB Press",5,SS),ex("DB Shrug",5),ex("DB Walking Lunge (reps per leg)",5,SS),ex("Hanging Leg Raise",5,{sets:3,reps:"10-15"})]}]},
  {name:"Strength",weeks:3,sets:3,reps:"3-5",rest:105,warmup:2,note:"Heavy. Do 2–3 lighter warm-up sets first and keep every rep clean.",workouts:[
   {id:"w1",exercises:[ex("Back Squat",5,{sets:4}),ex("Barbell Row",5,{reps:"6-8",ss:true}),ex("Incline Barbell Bench Press",5),ex("Weighted Pull-up",5,SS),ex("Landmine Rotation (reps per side)",5,{sets:3,reps:"8-10"})]},
   {id:"w2",exercises:[ex("Deadlift",10,{sets:4}),ex("Standing Barbell Overhead Press",5,SS),ex("Barbell Shrug",10,{reps:"6-8"}),ex("DB Bulgarian Split Squat (reps per leg)",5,{reps:"6-8",ss:true}),ex("Hanging Leg Raise",5,{sets:3,reps:"10-15"})]}]},
  {name:"Deload",weeks:1,sets:2,reps:"8-10",rest:60,note:"Recovery week: about 60% of your usual weights. Then the cycle repeats, stronger.",workouts:[
   {id:"w1",exercises:[ex("Back Squat",5),ex("Barbell Row",5,SS),ex("Incline DB Press",5),ex("Pull-up",5,SS),ex("Plank",5,{reps:"30-45s"})]},
   {id:"w2",exercises:[ex("Romanian Deadlift",10),ex("Overhead DB Press",5,SS),ex("DB Shrug",5),ex("DB Walking Lunge (reps per leg)",5,SS),ex("Hanging Leg Raise",5,{reps:"10-15"})]}]}
 ]};
/* Round 2: "The Works Part Deux" — same structure and phases, new variations */
const ROUND2=()=>[
 [{id:"w1",exercises:[ex("Front Squat",5,{reps:"10-12"}),ex("Landmine Row",5,SS),ex("Flat DB Bench Press",5),ex("Neutral-Grip Pull-up (band if needed)",5,{reps:"8-12",ss:true}),ex("Side Plank (per side)",5,{sets:3,reps:"30-40s"}),ex("Dip",5,{sets:2,reps:"10-15",ss:true}),ex("DB Hammer Curl",5,{sets:2})]},
  {id:"w2",exercises:[ex("DB Romanian Deadlift",5),ex("Seated DB Shoulder Press",5,SS),ex("DB Shrug",5),ex("DB Step-Up (reps per leg)",5,SS),ex("Hanging Knee Raise",5,{sets:3}),ex("Overhead DB Triceps Extension",5,{sets:2,ss:true}),ex("Barbell Curl",5,{sets:2})]}],
 [{id:"w1",exercises:[ex("Front Squat",5,{sets:4}),ex("Pendlay Row",5,SS),ex("Incline Barbell Bench Press",5),ex("Chin-up",5,SS),ex("Long-Lever Plank",5,{sets:3,reps:"30-45s"})]},
  {id:"w2",exercises:[ex("Barbell Hip Thrust",10,{sets:4}),ex("Arnold Press",5,SS),ex("Barbell Shrug",10),ex("Front-Foot-Elevated Split Squat (reps per leg)",5,SS),ex("Hanging Leg Raise",5,{sets:3,reps:"10-15"})]}],
 [{id:"w1",exercises:[ex("Paused Back Squat",5,{sets:4}),ex("Pendlay Row",5,{reps:"6-8",ss:true}),ex("Paused Bench Press",5),ex("Weighted Chin-up",5,SS),ex("Weighted Plank",5,{sets:3,reps:"30-45s"})]},
  {id:"w2",exercises:[ex("Sumo Deadlift",10,{sets:4}),ex("Push Press",5,SS),ex("Barbell Shrug",10,{reps:"6-8"}),ex("Heavy DB Walking Lunge (reps per leg)",5,{reps:"6-8",ss:true}),ex("Hanging Leg Raise",5,{sets:3,reps:"10-15"})]}],
 [{id:"w1",exercises:[ex("Front Squat",5),ex("Pendlay Row",5,SS),ex("Incline Barbell Bench Press",5),ex("Chin-up",5,SS),ex("Long-Lever Plank",5,{reps:"30-45s"})]},
  {id:"w2",exercises:[ex("Barbell Hip Thrust",10),ex("Arnold Press",5,SS),ex("Barbell Shrug",10),ex("Front-Foot-Elevated Split Squat (reps per leg)",5,SS),ex("Hanging Leg Raise",5,{reps:"10-15"})]}]
];
const ROUND_NAMES=["The Works","The Works Part Deux"];
const fresh=()=>{const p=JSON.parse(JSON.stringify(DEFAULT));p.v=6;p.roundNames=ROUND_NAMES.slice();ROUND2().forEach((ws,i)=>{if(p.phases[i])p.phases[i].workouts2=ws});return p};

const S={er:null,body:{heightIn:null,entries:[]},pOpen:null,edit:null,ep:null,demo:{},program:null,sessions:[],draft:null,tab:"workout",open:{},adding:false,restStart:null,armed:null};

/* ---------- storage: account sync (db) + on-device cache ---------- */
const LS="liftlog.v1";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({program:S.program,sessions:S.sessions,draft:S.draft,body:S.body}))}catch(e){}}
let coll=null;
const syncEl=document.getElementById("sync");
function setSync(k){const t={ok:"Synced",saving:"Saving…",err:"Sync error",local:"Saved on this phone",syncing:"Syncing…"};syncEl.className=k;syncEl.textContent=t[k]||""}
function unwrap(x){if(!x)return null;if(x.key)return x;if(typeof x.data==="function"){const d=x.data();return d&&d.key?d:null}if(x.data&&typeof x.data==="object"&&x.data.key)return x.data;return null}
function docsOf(r){if(!r)return[];if(Array.isArray(r))return r;if(Array.isArray(r.docs))return r.docs;if(typeof r.forEach==="function"){const a=[];r.forEach(d=>a.push(d));return a}return[]}
const pend={},busy={},tmr={};
function put(key,val){lsSave();if(!coll)return;pend[key]={v:val};clearTimeout(tmr[key]);tmr[key]=setTimeout(()=>flush(key),500)}
async function flush(key){
  if(busy[key]){tmr[key]=setTimeout(()=>flush(key),300);return}
  const p=pend[key];if(!p)return;delete pend[key];busy[key]=true;setSync("saving");
  try{const d=coll.doc(key);if(p.v==null)await d.delete();else await d.set(JSON.parse(JSON.stringify(p.v)));setSync(Object.keys(pend).length?"saving":"ok")}
  catch(e){setSync("err")}
  busy[key]=false;
}
const saveProgram=()=>put("program",Object.assign({key:"program",type:"program"},S.program));
const saveDraft=()=>put("draft",S.draft?{key:"draft",type:"draft",session:S.draft}:null);
const saveSession=s=>put("s_"+s.id,Object.assign({key:"s_"+s.id,type:"session"},s));
const delSession=id=>put("s_"+id,null);
const validProg=p=>p&&p.v===6&&Array.isArray(p.workouts)&&Array.isArray(p.phases);
const ARMS=/^(dip|db curl|db hammer curl|incline db curl|barbell curl|db skull crusher|overhead db triceps extension|close-grip bench press)$/i;
function trimV6(p){/* keep workouts near 45 min: fewer arm sets in Pump, no arm finisher in Build, 3 sets (main lift 4) in Build/Strength */
  const [p0,p1,p2]=p.phases;["workouts","workouts2"].forEach(k=>{
    if(p0&&p0[k])p0[k].forEach(w=>w.exercises.forEach(e=>{if(ARMS.test(e.name.trim())&&num(e.sets)===3)e.sets=2}));
    if(p1&&p1[k])p1[k].forEach(w=>{w.exercises=w.exercises.filter(e=>!ARMS.test(e.name.trim()));const l=w.exercises[w.exercises.length-1];if(l)l.ss=false;if(num(p1.sets)===4&&w.exercises[0]&&!num(w.exercises[0].sets))w.exercises[0].sets=4});
    if(p2&&p2[k])p2[k].forEach(w=>{if(num(p2.sets)===4&&w.exercises[0]&&!num(w.exercises[0].sets))w.exercises[0].sets=4});
  });
  if(p1&&num(p1.sets)===4)p1.sets=3;
  if(p2){if(num(p2.sets)===4)p2.sets=3;if(num(p2.rest)===120)p2.rest=105;if(p2.warmup==null||p2.warmup==="")p2.warmup=2}
}
function upgrade(old){
  if(old&&(old.v===4||old.v===5)&&Array.isArray(old.phases)){const p=JSON.parse(JSON.stringify(old));
    if(p.v===4){p.v=5;p.roundNames=ROUND_NAMES.slice();const R=ROUND2();p.phases.forEach((ph,i)=>{if(!ph.workouts2)ph.workouts2=R[i]||JSON.parse(JSON.stringify(ph.workouts||[]))})}
    trimV6(p);p.v=6;return p}
  const n=fresh();if(old&&old.startDate)n.startDate=old.startDate;if(old&&old.daysPerWeek)n.daysPerWeek=old.daysPerWeek;return n}

/* render the retro logo with the web font so it can be packaged as the home-screen icon */
const LOGO_VER="retro2";
function rr(x,a,b,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h)}
function drawRetro(x,k,ox,oy){/* same geometry as the header SVG (240x92 units) */
  const N="#1d2a4d",R="#e5383b",U=(v)=>v*k;x.save();x.translate(ox,oy);x.lineJoin="round";
  x.save();x.translate(U(120),U(44));x.rotate(-5*Math.PI/180);x.translate(-U(120),-U(44));
  x.font=U(50)+"px Yellowtail";x.textAlign="center";
  x.lineWidth=U(8);x.strokeStyle=N;x.fillStyle=N;x.strokeText("JaysGym",U(123.5),U(56.5));x.fillText("JaysGym",U(123.5),U(56.5));
  x.lineWidth=U(7);x.strokeStyle=R;x.strokeText("JaysGym",U(120),U(53));x.fillStyle="#fff";x.fillText("JaysGym",U(120),U(53));x.restore();
  x.translate(0,U(5));
  const star=(cx,cy,r)=>{x.beginPath();for(let i=0;i<10;i++){const q=i%2?r*.45:r,an=i*Math.PI/5;x.lineTo(U(cx+q*Math.sin(an)),U(cy-q*Math.cos(an)))}x.closePath()};
  x.lineWidth=U(2.5);x.strokeStyle=N;
  const shape=(fn,fill)=>{fn();x.fillStyle=fill;x.fill();x.stroke()};
  shape(()=>star(34,75,7),"#fff");shape(()=>star(206,75,7),"#fff");
  [[52,71,9,9,3,N],[179,71,9,9,3,N],[84,70,72,11,5.5,"#3a3f4b"],[59,64,13,23,5,R],[168,64,13,23,5,R],[70,57,17,37,6.5,R],[153,57,17,37,6.5,R]].forEach(q=>shape(()=>rr(x,U(q[0]),U(q[1]),U(q[2]),U(q[3]),U(q[4])),q[5]));
  x.fillStyle="#fff";[[73.5,61,4,13,2],[156.5,61,4,13,2],[61.5,67,3,8,1.5],[170.5,67,3,8,1.5]].forEach(q=>{rr(x,U(q[0]),U(q[1]),U(q[2]),U(q[3]),U(q[4]));x.fill()});
  x.globalAlpha=.55;rr(x,U(92),U(72.5),U(40),U(2.5),U(1.25));x.fill();x.globalAlpha=1;x.restore();
}
function drawLogo(size,icon){
  const c=document.createElement("canvas"),x=c.getContext("2d");
  if(icon){c.width=c.height=size;x.fillStyle="#fbf3e4";x.fillRect(0,0,size,size);
    x.strokeStyle="#e5383b";x.lineWidth=size*.028;rr(x,size*.06,size*.06,size*.88,size*.88,size*.14);x.stroke();
    const k=size*.86/240;drawRetro(x,k,(size-240*k)/2,(size-98*k)/2);}
  else{const k=size/250;c.width=size;c.height=Math.round(106*k);drawRetro(x,k,5*k,4*k)}
  return c.toDataURL("image/png");
}
async function captureLogo(db){
  if(!document.fonts)return;await document.fonts.load("100px Yellowtail");if(!document.fonts.check("100px Yellowtail"))return;
  const d=db.doc("assets/logo");let cur=null;try{cur=unwrap(await d.get())}catch(e){}
  if(cur&&cur.ver===LOGO_VER)return;
  await d.set({key:"logo",ver:LOGO_VER,icon512:drawLogo(512,true),icon192:drawLogo(192,true),icon180:drawLogo(180,true),wordmark:drawLogo(600,false)});
}
async function connect(){
  /* standalone build: everything is saved on this phone */
  setSync("local");
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  /* draw the full script logo as the home-screen icon once the font is ready */
  try{if(document.fonts){await document.fonts.load("100px Yellowtail");if(document.fonts.check("100px Yellowtail")){const l=document.getElementById("touchIcon");if(l)l.href=drawLogo(180,true)}}}catch(e){}
}

/* ---------- program logic ---------- */
const P=()=>S.program;
const totalWeeks=()=>P().phases.reduce((a,p)=>a+Math.max(1,num(p.weeks)),0)||1;
function anchor(){const p=P();if(p.weekAnchor&&p.weekAnchor.at)return p.weekAnchor;return{raw:1,at:p.startDate?midnight(p.startDate):midnight(Date.now())}}
function rawWeek(){return anchor().raw} /* weeks only move forward when you move them */
const wkTarget=raw=>num((P().weekTargets||{})[raw])||num(P().daysPerWeek)||2;
function advanceWeek(){const wi=weekInfo(),p=P();p.weekHist=(p.weekHist||[]).concat([{raw:wi.raw,at:wi.wkStart}]).slice(-60);p.weekAnchor={raw:wi.raw+1,at:Date.now()};saveProgram()}
function weekAt(raw){const tw=totalWeeks(),cycle=Math.floor((raw-1)/tw)+1,week=((raw-1)%tw)+1;let acc=0,pi=0;for(let i=0;i<P().phases.length;i++){acc+=Math.max(1,num(P().phases[i].weeks));if(week<=acc){pi=i;break}}
  const o=P().activeRound,r=(o!=null&&o>=0&&o<nRounds())?o:(cycle-1)%nRounds();return{raw,week,cycle,pi,phase:P().phases[pi],r}}
function weekInfo(){
  const raw=Math.max(1,rawWeek()),tw=totalWeeks();
  const cycle=Math.floor((raw-1)/tw)+1,week=((raw-1)%tw)+1;
  let acc=0,pi=0;for(let i=0;i<P().phases.length;i++){acc+=Math.max(1,num(P().phases[i].weeks));if(week<=acc){pi=i;break}}
  const a=anchor(),wkStart=a.at+(raw-a.raw)*7*DAY;
  return{raw,week,cycle,tw,pi,phase:P().phases[pi],wkStart};
}
function shiftWeek(d){const wi=weekInfo(),p=P();if(d>0){advanceWeek();return}
  const h=p.weekHist||[],last=h[h.length-1];
  if(last&&last.raw===wi.raw-1){p.weekAnchor=h.pop();p.weekHist=h} /* go back: restore that week as it was, with its finished workouts */
  else p.weekAnchor={raw:Math.max(1,wi.raw-1),at:wi.wkStart};
  saveProgram()}

const parseRange=s=>{const m=String(s||"").match(/(\d+)\s*(?:-|–|to)\s*(\d+)/);if(m)return[+m[1],+m[2]];const n=parseInt(s);return n?[n,n]:null};
const e1rm=(w,r)=>(w>0&&r>0)?w*(1+Math.min(r,15)/30):0;
const nameKey=n=>String(n||"").trim().toLowerCase();
function exHistory(name){
  const k=nameKey(name),out=[];
  S.sessions.slice().sort((a,b)=>(a.start||"").localeCompare(b.start||"")).forEach(s=>{
    const e=(s.exercises||[]).find(x=>nameKey(x.name)===k);if(!e)return;
    const ws=(e.sets||[]).filter(x=>!x.wu);if(!ws.length)return;
    const top=Math.max(...ws.map(x=>num(x.w)));const topSet=ws.filter(x=>num(x.w)===top).sort((a,b)=>num(b.r)-num(a.r))[0];
    out.push({s,e,ws,top,topSet,e1:Math.max(...ws.map(x=>e1rm(num(x.w),num(x.r)))),reps:Math.max(...ws.map(x=>num(x.r))),kind:e.kind||"reps"});
  });
  return out;
}
function progInfo(name,pi){
  const k=nameKey(name),ph=P().phases[pi];
  const find=(phx)=>{for(const w of ((phx&&phx.workouts)||[]).concat((phx&&phx.workouts2)||[])){const x=w.exercises.find(e=>nameKey(e.name)===k);if(x)return{inc:num(x.inc)||5,reps:exReps(x,phx)}}return null};
  return find(ph)||P().phases.map(find).find(Boolean)||{inc:5,reps:ph?ph.reps:"8-10"};
}
function suggestion(name,pi){
  const H=exHistory(name).filter(h=>h.s.phase===pi);if(!H.length)return null;
  const last=H[H.length-1],info=progInfo(name,pi),rg=parseRange(last.e.reps||info.reps);if(!rg)return null;
  const[lo,hi]=rg,ws=last.ws;
  if(last.kind==="time"){return ws.every(x=>num(x.r)>=hi)?{type:"up",msg:`Held ${hi}s+ on every set. Add 5–10 sec or hold a plate.`}:null}
  const w=last.top;
  const allHi=ws.every(x=>num(x.r)>=hi&&num(x.w)>=w);
  let streak=0;for(let i=H.length-1;i>=0;i--){const h=H[i];if(h.top===w&&h.ws.every(x=>num(x.r)>=lo))streak++;else break}
  if(w===0)return allHi?{type:"up",msg:`${hi}+ reps on every set. Add weight (dumbbell or belt) — start with 5–10 lb.`}:null;
  if(allHi)return{type:"up",w:w+info.inc,from:w,msg:`You hit ${hi}+ reps on all ${ws.length} sets at ${fmtW(w)} lb.`};
  if(streak>=3)return{type:"up",w:w+info.inc,from:w,msg:`${streak} workouts in a row at ${fmtW(w)} lb — time to go up.`};
  let miss=0;for(let i=H.length-1;i>=Math.max(0,H.length-2);i--){const h=H[i];if(h.top===w&&h.ws.some(x=>num(x.r)<lo))miss++}
  if(miss>=2)return{type:"hold",w,msg:`Came up short of ${lo} reps twice at ${fmtW(w)} lb. Stay here, or drop ~10% and build back up.`};
  return null;
}
function prsIn(s){
  const out=[];(s.exercises||[]).forEach(e=>{if(e.kind==="time")return;
    const ws=e.sets.filter(x=>!x.wu);const now=Math.max(0,...ws.map(x=>e1rm(num(x.w),num(x.r))));if(!now)return;
    const prev=exHistory(e.name).filter(h=>h.s.id!==s.id&&(h.s.start||"")<(s.start||""));
    if(prev.length&&now>Math.max(...prev.map(h=>h.e1))+.01)out.push(e.name.replace(/\s*\(.*\)/,""));
  });return out;
}

function computeBadges(sessions){

  const earned={};const rel=d=>st.rel[d.id]||0;
  const val=d=>d.kind==="workouts"?st.workouts:d.kind==="volume"?st.volume:d.kind==="plate"?st.plate:d.kind==="prs"?st.prs:d.kind==="express"?st.express:d.kind==="pull"?st.pull:d.kind==="cycle"?st.phases.size:d.kind==="rel"?rel(d):d.kind==="streak"?st.streak||0:0;
  L.forEach(s=>{
    const t=new Date(s.start).getTime(),wk=weekStart(t);weekCount[wk]=(weekCount[wk]||0)+1;
    st.workouts++;st.volume+=vol(s);if(s.express)st.express++;if(s.phase!=null)st.phases.add(s.phase);
    let streak=weekCount[wk]>=dpw?1:0;if(streak){for(let w=wk-7*DAY;weekCount[w]>=dpw;w-=7*DAY)streak++}st.streak=Math.max(st.streak||0,streak);
    const bw=bwAt(t);
    (s.exercises||[]).forEach(e=>{if(e.kind==="time")return;const ws=(e.sets||[]).filter(x=>!x.wu);if(!ws.length)return;
      const n=nameKey(e.name),top=Math.max(...ws.map(x=>num(x.w))),e1=Math.max(...ws.map(x=>e1rm(num(x.w),num(x.r))));
      st.plate=Math.max(st.plate,top);
      if(/pull-?up|chin/.test(n)&&top===0)st.pull=Math.max(st.pull,...ws.map(x=>num(x.r)));
      if(e1>0){if(best[n]!=null&&e1>best[n]+.01)st.prs++;best[n]=Math.max(best[n]||0,e1)}
      defs.forEach(d=>{if(d.kind==="rel"&&bw>0&&d.lift.test(n)&&!d.ex.test(n))st.rel[d.id]=Math.max(rel(d),top/bw)});

  });

}

function restoreFrom(text){

  if(!o||!Array.isArray(o.sessions)){toast("That doesn't look like a JaysGym backup");return}
  const ids=new Set(S.sessions.map(x=>x.id));let n=0;
  o.sessions.forEach(x=>{if(x&&x.id&&Array.isArray(x.exercises)&&!ids.has(x.id)){S.sessions.push(x);saveSession(x);ids.add(x.id);n++}});
  if(o.body&&Array.isArray(o.body.entries)){const bi=new Set(S.body.entries.map(e=>e.id));o.body.entries.forEach(e=>{if(e&&e.id&&!bi.has(e.id)){S.body.entries.push(e);bi.add(e.id)}});if(o.body.heightIn&&!S.body.heightIn)S.body.heightIn=o.body.heightIn;saveBody()}
  if(o.program){S.program=validProg(o.program)?o.program:upgrade(o.program);saveProgram()}

    case"del":{const id=b.dataset.id;if(S.armed==="del"+id){S.sessions=S.sessions.filter(s=>s.id!==id);delSession(id);S.armed=null;render()}else arm("del"+id);break}
    case"setup":p.setupMin=+b.dataset.n;saveProgram();render();break;
    case"dpw":p.daysPerWeek=+b.dataset.n;saveProgram();render();break;
    case"wk+":shiftWeek(1);render();break;
    case"wk-":shiftWeek(-1);render();break;
    case"ep":S.ep=+b.dataset.i;render();break;
    case"er":S.er=+b.dataset.i;render();break;
    case"setround":{if(S.draft){toast("Finish or discard your current workout first");return}P().activeRound=+b.dataset.i;S.er=null;saveProgram();render();toast("Now training "+roundName(curRound()));break}
    case"autoround":{if(S.draft){toast("Finish or discard your current workout first");return}P().activeRound=null;S.er=null;saveProgram();render();toast("Back to auto-rotating · "+roundName(curRound()));break}
    case"addphase":{const last=p.phases[p.phases.length-1];const nw=JSON.parse(JSON.stringify(last.workouts||[]));nw.forEach(w=>w.exercises.forEach(e=>e.id=uid()));const nw2=JSON.parse(JSON.stringify(last.workouts2||last.workouts||[]));nw2.forEach(w=>w.exercises.forEach(e=>e.id=uid()));p.phases.push({name:"Phase "+(p.phases.length+1),weeks:3,sets:3,reps:"8-10",rest:90,note:"",workouts:nw,workouts2:nw2});}saveProgram();render();break;
    case"rmphase":p.phases.splice(+b.dataset.i,1);S.ep=null;saveProgram();render();break;
    case"addday":{const id=uid();p.workouts.push({id,name:"Workout "+(p.workouts.length+1)});p.phases.forEach((x,i)=>{for(let r=0;r<nRounds();r++)pwById(i,id,r).exercises.push(ex("",5))});saveProgram();render();break}
    case"rmday":{const di=+b.dataset.di;if(S.armed==="day"+di){const id=p.workouts[di].id;p.workouts.splice(di,1);p.phases.forEach(x=>{for(let r=0;r<nRounds();r++){const k=wkey(r);if(x[k])x[k]=x[k].filter(w=>w.id!==id)}});S.armed=null;saveProgram();render()}else arm("day"+di);break}
    case"addpex":pw(epi(),+b.dataset.di).exercises.push(ex("",5));saveProgram();render();
      {const ins=view.querySelectorAll(`[data-pf="name"][data-di="${b.dataset.di}"]`);if(ins.length)ins[ins.length-1].focus()}break;
    case"rmex":pw(epi(),+b.dataset.di).exercises.splice(+b.dataset.xi,1);saveProgram();render();break;
    case"ss":{const e=pw(epi(),+b.dataset.di).exercises[+b.dataset.xi];e.ss=!e.ss;saveProgram();render();break}
    case"up":case"down":{const L=pw(epi(),+b.dataset.di).exercises,i=+b.dataset.xi,j=a==="up"?i-1:i+1;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];saveProgram();render();break}
    case"reset":if(S.armed==="reset"){const sd=p.startDate;S.program=fresh();S.program.startDate=sd;S.armed=null;saveProgram();render()}else arm("reset");break;
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target,p=P();
  if(t.dataset.f&&S.draft){const row=t.closest(".row");const s=S.draft.exercises[+row.dataset.ei].sets[+row.dataset.si];s[t.dataset.f]=num(t.value);saveDraft();return}
  if(t.dataset.body){const ft=document.querySelector('[data-body="ft"]'),inn=document.querySelector('[data-body="in"]');const tot=num(ft&&ft.value)*12+num(inn&&inn.value);S.body.heightIn=tot>0?tot:null;saveBody();return}
  if(t.dataset.he&&S.edit){const f=t.dataset.he,c=S.edit.s;
    if(f==="date")c.date=t.value;else{const e=c.exercises[+t.dataset.ei];if(!e)return;if(f==="name")e.name=t.value;else{const x=e.sets[+t.dataset.si];if(x)x[f]=num(t.value)}}return}
  if(t.dataset.ph){const ph=p.phases[+t.dataset.i],f=t.dataset.ph;ph[f]=(f==="name"||f==="reps"||f==="note")?t.value:f==="warmup"?(t.value.trim()===""?"":Math.max(0,parseInt(t.value)||0)):(num(t.value)||"");saveProgram();return}
  if(t.dataset.pf){const w=p.workouts[+t.dataset.di];
    if(t.dataset.pf==="wname")w.name=t.value;
    else{const e=pw(epi(),+t.dataset.di).exercises[+t.dataset.xi],f=t.dataset.pf;e[f]=(f==="sets")?(parseInt(t.value)||""):(f==="inc")?(num(t.value)||""):t.value}
    saveProgram();}
});
document.addEventListener("change",ev=>{const t=ev.target;if(t.id==="bkFile"&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>restoreFrom(String(r.result||""));r.readAsText(t.files[0]);t.value=""}});
document.addEventListener("focusin",ev=>{const t=ev.target;if(t.dataset&&t.dataset.f)setTimeout(()=>{try{t.select()}catch(e){}},0)});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.id==="heNew"){ev.preventDefault();document.querySelector('[data-act="he-addex"]').click()}else if(ev.key==="Enter"&&ev.target.id==="newex"){ev.preventDefault();document.querySelector('[data-act="addexgo"]').click()}else if(ev.key==="Enter"&&ev.target.dataset&&ev.target.dataset.f){ev.target.blur()}});

/* ---------- timers ---------- */
const restEl=document.getElementById("rest"),restT=document.getElementById("restT"),restG=document.getElementById("restG");
function resumeDraft(D){if(!D||!D.pausedAt)return;const gap=Date.now()-D.pausedAt;D.pausedMs=num(D.pausedMs)+gap;D.pausedAt=null;if(S.restStart)S.restStart+=gap;S.restPause=null;wakeOn()}
let actx=null;
function audioUnlock(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!actx)actx=new C();if(actx.state==="suspended")actx.resume()}catch(e){}}
function chime(){try{if(!actx)return;[0,.22,.44].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+d;o.frequency.value=i===2?1320:880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.2)});if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
let wl=null;
async function wakeOn(){try{if(navigator.wakeLock&&!wl&&document.visibilityState==="visible"){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
function wakeOff(){try{if(wl)wl.release()}catch(e){}wl=null}
document.addEventListener("visibilitychange",()=>{const D=S.draft;if(document.visibilityState==="visible"){if(D&&D.start&&!D.pausedAt)wakeOn();tick()}});
function holdDone(sec){const D=S.draft,h=S.hold;S.hold=null;if(!D||!h)return;const e=D.exercises[h.ei],st=e&&e.sets[h.si];
  if(st){st.r=Math.max(1,sec);st.done=true;const pairNext=e.ss&&D.exercises[h.ei+1];if(!pairNext){S.restStart=Date.now();S.restGoal=null;S.beeped=false}}
  saveDraft();render();tick()}
function tick(){
  if(S.draft&&S.draft.warmEnd&&!S.draft.warmDone){const left=(S.draft.warmEnd-Date.now())/1000,el=document.getElementById("warmT");
    if(el)el.textContent=left>0?mmss(left):"Done ✓";
    const m=Math.min(4,Math.floor((300-Math.max(0,left))/60));document.querySelectorAll(".wst").forEach(x=>{const i=+x.dataset.wi;x.classList.toggle("on",i===m&&left>0);x.classList.toggle("past",i<m||left<=0)});
    if(left<=0&&!S.draft.warmChimed){S.draft.warmChimed=true;chime();saveDraft();render()}}
  const D=S.draft;
  if(S.hold&&D){const left=S.hold.goal-(Date.now()-S.hold.start)/1000,ht=document.getElementById("holdT");if(ht)ht.textContent=mmss(Math.max(0,left));
    if(left<=0){chime();holdDone(S.hold.goal);return}}
  const el=document.getElementById("elapsed");if(el&&D)el.textContent=mmss(activeSec(D));
  const pt=document.getElementById("pauseT");if(pt&&D&&D.pausedAt)pt.textContent=mmss((Date.now()-D.pausedAt)/1000);
  if(S.restStart&&D&&!D.pausedAt){const sec=(Date.now()-S.restStart)/1000,goal=S.restGoal||D.rest||90;restEl.hidden=false;restT.textContent=mmss(sec);
    const up=sec>=goal;restEl.classList.toggle("up",up);restG.textContent=up?"· go!":"/ "+mmss(goal);
    if(up&&!S.beeped){S.beeped=true;if(sec<goal+5)chime()}}
  else restEl.hidden=true;
}
setInterval(tick,250);

/* ---------- boot ---------- */
const cached=lsLoad();
S.program=(cached&&validProg(cached.program))?cached.program:upgrade(cached&&cached.program);
S.sessions=(cached&&Array.isArray(cached.sessions))?cached.sessions:[];
S.draft=(cached&&cached.draft&&cached.draft.v===2)?cached.draft:null;
if(S.program&&!S.program.weekAnchor&&S.program.startDate){const st=midnight(S.program.startDate),r=Math.max(1,Math.floor((midnight(Date.now())-st)/(7*DAY))+1);S.program.weekAnchor={raw:r,at:st+(r-1)*7*DAY};lsSave()}
if(cached&&cached.body&&Array.isArray(cached.body.entries))S.body={heightIn:cached.body.heightIn||null,entries:cached.body.entries};
render();
connect();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  /* when a new version takes over, reload once so you see it immediately (not mid-workout) */
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW&&!reloaded&&!S.draft){reloaded=true;location.reload()}});
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update().catch(()=>{});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update().catch(()=>{})})}).catch(()=>{})});
}
})();
</script>
</body>
